<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社区快递驿站 · 实时监测平台</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 点开即用：根路径直接渲染 B 端大屏，顶部一条极简切换条 */
  html, body { margin: 0; padding: 0; }
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 16px;
    background: rgba(11,18,16,.96);
    border-bottom: 1px solid #22362d;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 12.5px; color: #b3c8c0;
    backdrop-filter: blur(8px);
  }
  #topbar .brand { font-weight: 700; color: #3ddc97; letter-spacing: .3px; }
  #topbar .brand small { font-weight: 400; color: #7d948c; margin-left: 6px; font-size: 11px; }
  #topbar button {
    font: inherit; font-size: 12px;
    padding: 4px 13px; border-radius: 7px;
    border: 1px solid #22362d; background: #121e19; color: #b3c8c0;
    cursor: pointer; transition: .15s;
  }
  #topbar button:hover { border-color: #3ddc97; color: #3ddc97; }
  #topbar button.on { background: #3ddc97; color: #04231a; border-color: #3ddc97; font-weight: 700; }
  #topbar .right { margin-left: auto; color: #7d948c; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  #topbar .dot { width: 6px; height: 6px; border-radius: 99px; background: #3ddc97; animation: tbBlink 1.4s infinite; }
  @keyframes tbBlink { 0%,100%{opacity:1} 50%{opacity:.25} }

  #frameWrap { padding-top: 40px; height: 100vh; box-sizing: border-box; }
  #frame { width: 100%; height: 100%; border: 0; display: block; background: #0b1210; }
  @media (max-width: 700px) {
    #topbar .brand small { display: none; }
    #topbar .right { display: none; }
  }
</style>
</head>
<body>

<div id="topbar">
  <span class="brand">📦 驿站监测平台<small>社区快递驿站 · 建筑物联网改造</small></span>
  <button data-go="b.html" class="on">B 端 · 管理台</button>
  <button data-go="c.html">C 端 · 居民端</button>
  <span class="right"><span class="dot"></span>实时运行中</span>
</div>

<div id="frameWrap">
  <iframe id="frame" src="b.html" title="驿站监测平台"></iframe>
</div>

<script>
(function () {
  var frame = document.getElementById('frame');
  var btns = document.querySelectorAll('#topbar button');

  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      btns.forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      frame.src = b.getAttribute('data-go');
    });
  });

  // 支持 ?page=c 直接进 C 端
  var q = new URLSearchParams(location.search);
  var want = q.get('page');
  if (want === 'c') {
    frame.src = 'c.html';
    btns.forEach(function (x) {
      x.classList.toggle('on', x.getAttribute('data-go') === 'c.html');
    });
  }
})();
</script>

</body>
</html>
